name: Auth Microservice Unit Tests

on:
  pull_request:
    branches: [develop]

defaults:
  run:
    working-directory: "AuthMicroservice Backend"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'oracle'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Run tests
      run: ./mvnw test